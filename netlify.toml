# ============================================================================
#  Netlify configuration
# ============================================================================
#
#  This site is a static multi-page build: every route is a real file on disk.
#  There is deliberately NO catch-all redirect to index.html — a /* -> 200
#  rewrite turns every mistyped or removed URL into the homepage served with a
#  200, which search engines treat as a soft 404. Netlify serves 404.html for
#  anything genuinely missing.
#
# ----------------------------------------------------------------------------
#  DEPLOY TARGET
# ----------------------------------------------------------------------------
#  This build goes live on https://sb24tow.co.uk (a bridge domain — see
#  site_config.py). The noindex header that kept the Netlify demo out of Google
#  has been REMOVED, so the site is fully crawlable from here on.
#
#  Canonicals, sitemap and schema all read from SITE_URL in site_config.py.
#  If the domain changes, change it THERE and rebuild — never hand-edit the
#  generated HTML.
# ----------------------------------------------------------------------------

[build]
  publish = "."

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(self), camera=(), microphone=()"

# Static assets are safe to cache hard. Filenames are stable, and a content
# change is a rebuild plus the cache-busting query in the referencing markup.
[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# HTML should revalidate so content edits go live immediately.
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Content-Type = "application/xml; charset=utf-8"
    Cache-Control = "public, max-age=3600"