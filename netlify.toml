# ============================================================================
#  Netlify configuration
# ============================================================================
#
#  This site is a static multi-page build: every route is a real file on disk.
#  There is deliberately NO catch-all redirect to index.html — a /* -> 200
#  rewrite turns every mistyped or removed URL into the homepage served with a
#  200, which search engines treat as a soft 404. Netlify serves 404.html for
#  anything genuinely missing.
#
# ----------------------------------------------------------------------------
#  LEGACY — Netlify
# ----------------------------------------------------------------------------
#  Production hosting has moved to Cloudflare Workers (see wrangler.jsonc and
#  _headers). This file is kept so historical Netlify deploys and audit.py's
#  noindex guard still have something to inspect. Prefer editing _headers for
#  live cache / security headers.
#
#  Canonicals, sitemap and schema all read from SITE_URL in site_config.py
#  (https://simpsonsbreakdownrecovery.co.uk). Change it THERE and rebuild —
#  never hand-edit the generated HTML.
# ----------------------------------------------------------------------------

[build]
  publish = "."

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(self), camera=(), microphone=()"

# Static assets are safe to cache hard. Filenames are stable, so a content
# change to an image needs a NEW URL to reach returning visitors — that is why
# the hero background is referenced as ../images/hero-bg.jpg?v=2 in style.css.
# Bump that query when build_hero.py is re-run.
[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# CSS and JS revalidate instead of being cached for a week. They change on
# almost every deploy, they are small enough that a 304 costs nothing, and a
# week-long cache meant a text or layout fix was invisible to anyone who had
# visited before it shipped.
[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# HTML should revalidate so content edits go live immediately.
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Content-Type = "application/xml; charset=utf-8"
    Cache-Control = "public, max-age=3600"